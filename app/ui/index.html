<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ITS ME</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="resume.css">
  <link rel="stylesheet" href="inspector-panels.css">
  <link rel="stylesheet" href="rich-editing.css">
  <link rel="stylesheet" href="content-check.css">
  <link rel="stylesheet" href="layout-review.css">
  <link rel="stylesheet" href="template-preview.css">
  <link rel="stylesheet" href="workspace-panels.css">
  <link rel="stylesheet" href="backup-preview.css">
  <link rel="stylesheet" href="history-review.css">
  <link rel="stylesheet" href="photo.css">
  <link rel="stylesheet" href="source-updates.css">
  <link rel="stylesheet" href="personal-templates.css">
  <link rel="stylesheet" href="projects-versions.css">
  <link rel="stylesheet" href="ai-assistant.css">
  <link rel="stylesheet" href="library-save-ai.css">
  <link rel="stylesheet" href="library-experience.css">
  <link rel="stylesheet" href="full-backup.css">
  <link rel="stylesheet" href="design-tools.css">
  <link rel="stylesheet" href="bilingual-sync.css">
  <link rel="stylesheet" href="help-center.css">
</head>
<body>
  <aside class="rail" aria-label="主导航">
    <div class="brand-lockup"><div class="brand" aria-hidden="true">i<span></span></div><div><strong>ITS ME</strong><small>你的经历，你的表达</small></div></div>
    <nav id="navigation"></nav>
    <div class="rail-bottom"><button type="button" id="help-action" class="help-rail-button" title="使用帮助（F1）">使用帮助 <kbd>F1</kbd></button><span class="offline-dot"></span><span>本地离线</span><small id="app-version">ITS ME</small></div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><span class="app-name">个人工作空间</span><span class="header-divider"></span><span id="screen-title">我的资料库</span></div><div class="top-actions"><span id="save-status" role="status">正在读取本地资料</span><button id="save-library-action" class="button secondary" hidden>保存资料</button><button id="primary-action" class="button primary" hidden></button></div></header>
    <div id="screen" class="screen"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" class="modal"><header><div><h2 id="modal-title"></h2><p id="modal-description"></p></div><button id="close-modal" class="icon-button" aria-label="关闭">×</button></header><div id="modal-content"></div></dialog>
  <script type="module" src="app.mjs"></script>
</body>
</html>
